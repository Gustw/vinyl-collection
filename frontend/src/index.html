<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vinyl Collection</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Relative href (no leading slash) so the icon also resolves when the app
      is served from a GitHub Pages sub-path like /vinyl-collection/.
    -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="apple-touch-icon" href="assets/favicon.svg" />
    <meta name="theme-color" content="#14161a" />
  </head>
  <body>
    <app-root></app-root>

    <!--
      Attribution footer, kept as static markup (not rendered by Angular) so it
      is present in the raw HTML that link validators and crawlers fetch — they
      don't execute JavaScript, so a component-rendered link is invisible to
      them. Required by the GetSongBPM API terms.
    -->
    <footer class="site-footer muted">
      Key &amp; BPM data from
      <a href="https://getsongbpm.com/" target="_blank" rel="noopener">GetSongBPM</a>
      and <a href="https://tunebat.com/" target="_blank" rel="noopener">Tunebat</a>;
      release data from
      <a href="https://www.discogs.com/" target="_blank" rel="noopener">Discogs</a>.
    </footer>
  </body>
</html>
