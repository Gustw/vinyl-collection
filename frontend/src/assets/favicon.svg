<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vinyl record">
  <!-- Record body -->
  <circle cx="32" cy="32" r="31" fill="#14161a" />
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2e3340" stroke-width="2" />

  <!-- Grooves -->
  <g fill="none" stroke="#3a4150" stroke-width="1.5">
    <circle cx="32" cy="32" r="26" />
    <circle cx="32" cy="32" r="22" />
    <circle cx="32" cy="32" r="18" />
  </g>

  <!-- Sheen across the grooves -->
  <path d="M11 11a30 30 0 0 1 42 42z" fill="#ffffff" opacity="0.06" />

  <!-- Label -->
  <circle cx="32" cy="32" r="11" fill="#5b8cff" />
  <circle cx="32" cy="32" r="11" fill="none" stroke="#3a63c4" stroke-width="1.5" />

  <!-- Spindle hole -->
  <circle cx="32" cy="32" r="2.6" fill="#14161a" />
</svg>

